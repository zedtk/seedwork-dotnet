name: Comment PR
description: Creates or updates a PR comment from a file

inputs:
  body-path:
    description: Path to the file containing the comment body
    required: true
  pr-number:
    description: Pull request number
    required: true

runs:
  using: composite
  steps:
    - name: Create or update PR comment
      uses: actions/github-script@v8
      with:
        script: |
          const fs = require('fs');
          const bodyPath = '${{ inputs.body-path }}';

          if (!fs.existsSync(bodyPath)) {
            core.setFailed(`Comment body file not found at ${bodyPath}`);
            return;
          }

          const body = fs.readFileSync(bodyPath, 'utf8');

          // TODO: This creates a new comment on each run. Could be optimized to update
          // the last comment from github-actions[bot] instead of creating duplicates.
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: ${{ inputs.pr-number }},
            body: body
          });
